# 문항 원본(data/)이나 빌드 도구(tools/)가 바뀌면 배포용 문항 데이터(site/data/)를 다시 만든다.
# 결과가 달라졌을 때만 봇이 커밋·푸시한다. 봇 커밋은 data/tools/가 아닌 site/data/만 바꾸므로 이 워크플로를 다시 부르지 않는다.
name: 문항 데이터 빌드

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "tools/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 저장소 가져오기
      - uses: actions/checkout@v4

      # 파이썬 3.12 준비 후 수식 변환·이미지 처리 라이브러리 설치
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      # 노드 20 준비 후 테스트용 의존성(jszip) 설치 (package-lock.json 기준)
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci

      # LaTeX → 한글 수식, 출처 문구, 그림 크기를 계산해 배포용 문항 데이터를 만든다
      - name: 문항 데이터 만들기
        run: python3 tools/build_problems.py data/math/problems.src.json site/data/math/problems.json

      # 엔진 스모크 테스트: 시험지 한 부를 실제로 조립해 본다 (out/은 커밋하지 않음)
      - name: 엔진 테스트
        run: npm test

      # 문항 데이터가 실제로 달라졌을 때만 커밋·푸시
      - name: 변경이 있으면 커밋하고 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "문항 데이터 변경 없음"
          else
            git commit -m "문항 데이터 다시 만들기 [자동]"
            git push origin HEAD:main
          fi
